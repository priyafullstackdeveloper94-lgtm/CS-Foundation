<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Practice</title>

    <link rel="stylesheet" href="css/mcq.css">

    <script src="js/mcq.js" defer></script>
</head>

<body>

    <div class="mcq-container">

        <div class="mcq-header">
            <h1 class="mcq-title">MCQ Practice</h1>

            <div class="mcq-info">
                <span id="questionCounter">
                    Question 1 of 20
                </span>

                <span id="score">
                    Score : 0
                </span>
            </div>
        </div>

        <div class="question-card">

            <h2 id="question" class="question">
                Loading Question...
            </h2>

            <div id="options" class="options-container">

            </div>

            <div id="result" class="result-message">

            </div>

        </div>

        <div class="button-container">

            <button id="prevBtn" class="action-btn">
                Previous
            </button>

            <button id="nextBtn" class="action-btn">
                Next
            </button>

        </div>

    </div>

</body>

</html>
